<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clickfinanci</title>
</head>

<body>

    <div></div>
    <script type="module" src="./src/main.tsx"></script>


    <!-- library React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <!-- library React DOM -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- library Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type='text/babel'>

        const container = document.querySelector('div');
        
        const invoices =[{
            id: 1,
            amount: '1.100,00',
            status: 'pending',
            issueDate: '10/10/2026',
            dueDate: '16/11/2026',
            customer: {
                id: 10,
                name: 'Barbearia Navalha de Ouro',
                email: 'barbearia@gmail.com',
            }
        }, {
            id: 2,
            amount: '1.200,00',
            status: 'pending',
            issueDate: '10/10/2026',
            dueDate: '16/11/2026',
            customer: {
                id: 20,
                name: 'Bodega do Ze',
                email: 'bodegadoze@gmail.com',
            }

        }, {
            id: 3,
            amount: '1.300,00',
            status: 'pending',
            issueDate: '10/10/2026',
            dueDate: '16/11/2026',
            customer: {
                id: 30,
                name: 'Padaria da maria',
                email: 'padaria@gmail.com',
            }
        }];

        const Title = () => <h1>clickfinanci</h1>;

        const InvoiceRow = (props) => {
            return <tr>
                <td>{props.object.customer.name}</td>
                <td>{props.object.amount} </td>
                <td>{props.object.issueDate} </td>
                <td>{props.object.dueDate} </td>
                <td>{props.object.status} </td>
            </tr>
        }

        const InvoiceTable = () => {
            return <>
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Valor</th>
                        <th>Data de Emissão</th>
                        <th>Data de Vencimento</th>
                        <th>Situação</th> 
                    </tr>  
                </thead>
                <tbody>
                    {invoices.map((invoice) => {
                        return <InvoiceRow key={invoice.id} object={invoice} />
                    })}
                </tbody>    
            </table>
            </>
        } 

        const Paragraph = () => <p>Sistema de Contas a Receber</p>;

        const Paragraph1 = (props) => <p style={{ color: props.color }} >{props.text}</p>;
        
        const App = () => {
            return <>
                {/* <Title />
                <Paragraph />
                <Paragraph1 text='Atributo 1' color='Blue' />
                <Paragraph1 text='Atributo 2' color='red' /> */}
                <Title/>
                <InvoiceTable/>
            </>;
        }

        const root = ReactDOM.createRoot(container);
        root.render(<App/>);


    </script>

</body>

</html>
